[project]
name = "voice-agent"
version = "1.0.0"
description = "AI Voice Agent with LiveKit Agents SDK"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[openai,silero,deepgram,turn-detector]~=1.4",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
