version: "3.9"

services:
  # ─────────────────────────────────────────────
  # LiveKit Server (Open Source, self-hosted)
  # ─────────────────────────────────────────────
  livekit-server:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # Redis (required for LiveKit multi-service)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────
  # Caddy (automatic SSL via Let's Encrypt)
  # ─────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # ─────────────────────────────────────────────
  # Voice Agent (Python backend)
  # ─────────────────────────────────────────────
  voice-agent:
    build:
      context: ../agent
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - LIVEKIT_URL=wss://${LIVEKIT_DOMAIN}
      - AGENT_CONFIG=/app/configs/default.yaml
    depends_on:
      - livekit-server

  # ─────────────────────────────────────────────
  # Frontend (Next.js)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - LIVEKIT_URL=wss://${LIVEKIT_DOMAIN}
      - PORT=3000
    depends_on:
      - livekit-server

volumes:
  redis-data:
  caddy-data:
  caddy-config:
