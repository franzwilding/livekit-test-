# LiveKit Server Configuration
# Docs: https://docs.livekit.io/home/self-hosting/deployment/

port: 7880
rtc:
  # UDP port range for WebRTC media
  port_range_start: 50000
  port_range_end: 60000
  # Use TCP fallback for restrictive firewalls
  tcp_port: 7881
  # Set to your server's public IP (REQUIRED for production)
  # node_ip: 1.2.3.4
  # use_external_ip: true

# API keys — generate your own!
# Use: openssl rand -hex 32
keys:
  # API_KEY: API_SECRET
  # Replace with your own keys:
  devkey: secret-change-me-in-production

redis:
  address: 127.0.0.1:6379

# Built-in TURN server (helps clients behind firewalls)
turn:
  enabled: true
  # Your TURN domain (can be same as main domain)
  # domain: turn.yourdomain.com
  tls_port: 5349
  udp_port: 3478

logging:
  level: info
  # json: true  # Enable for structured logging in production
